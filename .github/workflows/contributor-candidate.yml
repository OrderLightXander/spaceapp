name: Contribution security follow-up
on:
  push:
    branches: [codex/ci-validation]
permissions:
  contents: read
jobs:
  contribution-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a0862ae39fba3f7783c49beb8898466fec814a6d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify contribution base and tested tree
        run: |
          test "$(git rev-parse HEAD^)" = 50272acbe54c4d82bd3174d712456f6bf3af2e53
          test "$(git rev-parse HEAD^{tree})" = c823cd0e85561b3ccf386052950b23d0de43c740
      - name: Install checksum-verified official Gitleaks 8.24.3
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks_8.24.3_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
      - name: Scan the actual PR contribution range with unchanged config
        run: >-
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code=2
          --log-opts="50272acbe54c4d82bd3174d712456f6bf3af2e53..a0862ae39fba3f7783c49beb8898466fec814a6d"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked source dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Block fixable Medium, High and Critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-filesystem.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: spaceapp-source.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contribution-source-sbom
          path: spaceapp-source.spdx.json
          if-no-files-found: error
